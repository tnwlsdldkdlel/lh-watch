<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LH 실시간 경쟁률</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">LH 실시간 경쟁률</h1>
    <div class="sub">
      <span><span class="dot" id="dot"></span> <span id="status">불러오는 중…</span></span>
      <span id="period"></span>
    </div>
  </header>

  <div id="app"><div class="skel">불러오는 중…</div></div>

  <footer>
    <span id="updated"></span>
    <span><a href="https://apply.lh.or.kr/lhapply/apply/wt/wrtanc/selectWrtancList.do?mi=1026" target="_blank" rel="noopener">LH청약플러스 원문</a></span>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <span class="meta" id="dlg-meta"></span>
    <button type="button" aria-label="닫기" onclick="document.getElementById('dlg').close()">×</button>
  </div>
  <div class="dlg-body"><div class="scroll" id="dlg-body"></div></div>
</dialog>

<script type="module">
const HISTORY = '/api/history';

const $ = (id) => document.getElementById(id);
const rate = (a, q) => (q ? a / q : 0);
const fmt = (n) => n.toLocaleString('ko-KR');
const cls = (r) => (r >= 2 ? 'over' : r >= 1 ? 'hot' : 'cool');

let closesAt = null;
let hist = null;
let houses = null;
let past = null;
let curSi = {};

const man = (n) => `${Math.round(n / 10000).toLocaleString('ko-KR')}만`;

const median = (xs) => {
  const a = [...xs].sort((x, y) => x - y);
  return a.length % 2 ? a[(a.length - 1) / 2] : (a[a.length / 2 - 1] + a[a.length / 2]) / 2;
};
const ratio = (v) => v.a / v.q;
const pastRates = (si) => (past?.si?.[si] ?? []).filter(Boolean).map(ratio);
const bar = (r) => `<div class="bar ${cls(r)}"><i style="width:${Math.min(100, r * 10)}%"></i></div>`;

// past.json 은 지난 공고를 긁어 구운 정적 파일이라 지자체 단위다 — 단지가 아니라 시로 묶어 본다.
function openPast(si) {
  const row = past?.si?.[si];
  if (!row) return;
  const done = row.filter(Boolean);
  const now = curSi[si];
  $('dlg-title').textContent = si;
  $('dlg-meta').textContent = `지난 ${done.length}회 중앙 ${median(done.map(ratio)).toFixed(1)}:1`
    + (now ? ` · 이번 공급 ${fmt(now.q)}호` : '');
  $('dlg-body').innerHTML = `<table class="past">
    <thead><tr><th>회차</th><th>마감</th><th>공급</th><th>신청</th><th>경쟁률</th><th class="barcell"></th></tr></thead>
    <tbody>
      ${past.rounds.map((rd, i) => {
        const v = row[i];
        if (!v) return `<tr class="none"><td>${rd.label}</td><td>${rd.ed}</td><td colspan="4">공급 없음</td></tr>`;
        const r = ratio(v);
        return `<tr><td>${rd.label}</td><td>${rd.ed}</td><td>${fmt(v.q)}</td><td>${fmt(v.a)}</td>
          <td class="rate ${cls(r)}">${r.toFixed(1)}</td><td class="barcell">${bar(r)}</td></tr>`;
      }).join('')}
      ${now ? `<tr class="now"><td>이번</td><td>진행중</td><td>${fmt(now.q)}</td><td>${fmt(now.a)}</td>
        <td class="rate ${cls(ratio(now))}">${ratio(now).toFixed(1)}</td>
        <td class="barcell">${bar(ratio(now))}</td></tr>` : ''}
    </tbody></table>
    <p class="note">공급 물량이 많은 회차일수록 배수가 낮게 나옵니다 — 공급호수를 같이 보세요.</p>`;
  $('dlg').showModal();
}
window.openPast = openPast;

function openPastAll() {
  if (!past) return;
  const sis = Object.keys(past.si).sort((a, b) => median(pastRates(b)) - median(pastRates(a)));
  $('dlg-title').textContent = `${past.region} 전년도 경쟁률 이력`;
  $('dlg-meta').textContent = `${past.rounds.length}회차 · 지자체 ${sis.length}곳`;
  $('dlg-body').innerHTML = `<table class="matrix">
    <thead><tr><th>지자체</th><th>이번</th><th>중앙</th>${past.rounds.map((r) => `<th>${r.label}</th>`).join('')}</tr></thead>
    <tbody>${sis.map((si) => {
      const now = curSi[si];
      const m = median(pastRates(si));
      return `<tr${now ? '' : ' class="none"'}>
        <td>${si}</td>
        <td>${now ? `<span class="rate ${cls(ratio(now))}">${ratio(now).toFixed(1)}</span> <span class="sido">${fmt(now.q)}호</span>` : '–'}</td>
        <td class="rate ${cls(m)}">${m.toFixed(1)}</td>
        ${past.si[si].map((v) => (v ? `<td title="공급 ${fmt(v.q)}호 · 신청 ${fmt(v.a)}건">${ratio(v).toFixed(1)}</td>` : '<td class="speed">–</td>')).join('')}
      </tr>`;
    }).join('')}</tbody></table>
    <p class="note">현재 공고에 없는 지자체는 흐리게 표시됩니다. 정정공고는 같은 회차로 합쳤습니다.</p>`;
  $('dlg').showModal();
}
window.openPastAll = openPastAll;

// 공고 첨부 주택목록에서 구운 정적 파일. 매물 단위 경쟁률은 LH 가 공개하지 않아 물건 정보만 보여준다.
function openHouses(dong) {
  const list = houses?.[dong];
  if (!list?.length) return;
  $('dlg-title').textContent = dong;
  $('dlg-meta').textContent = `공급 ${list.length}호 · 임대조건은 소득 80% 이하 기준`;
  // 같은 건물에서 호수만 다른 것을 별개 매물처럼 늘어놓으면 물건 수를 오해한다.
  const byAddr = new Map();
  for (const h of list) {
    if (!byAddr.has(h.addr)) byAddr.set(h.addr, []);
    byAddr.get(h.addr).push(h);
  }

  $('dlg-body').innerHTML = `<table>
    <thead><tr><th>호</th><th>전용</th><th>방</th><th>층</th><th>보증금</th><th>월세</th></tr></thead>
    ${[...byAddr].map(([addr, hs]) => {
      const areas = hs.map((h) => h.area);
      const span = Math.min(...areas) === Math.max(...areas)
        ? `${areas[0]}㎡`
        : `${Math.min(...areas)}~${Math.max(...areas)}㎡`;
      return `<tbody>
        <tr class="grp"><td colspan="6">
          <span class="bldg">${addr}</span>
          <span class="addr">${hs.length}호 · ${span} · ${hs[0].type}</span>
        </td></tr>
        ${hs.map((h) => `<tr>
          <td>${h.ho}</td>
          <td>${h.area}㎡</td>
          <td>${h.rooms}</td>
          <td>${h.floor}</td>
          <td>${man(h.deposit)}</td>
          <td>${h.rent.toLocaleString('ko-KR')}</td>
        </tr>`).join('')}
      </tbody>`;
    }).join('')}
  </table>`;
  $('dlg').showModal();
}
window.openHouses = openHouses;

function countdown() {
  if (!closesAt) return;
  const ms = closesAt - Date.now();
  if (ms <= 0) { $('status').textContent = '접수 마감'; $('dot').className = 'dot closed'; return; }
  const h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1000) % 60;
  $('status').textContent = `마감까지 ${h}시간 ${String(m).padStart(2, '0')}분 ${String(s).padStart(2, '0')}초`;
}

// 값이 안 변하면 스냅샷을 남기지 않으므로 기록만으로는 최근 구간이 비어 보인다.
// 지금 값을 항상 끝점으로 붙여야 "시간당"이 옛 구간으로 계산되지 않는다.
const withNow = (pts, now) => (pts.at(-1)?.t === now.t ? pts : [...pts, now]);

// 단지별 시계열. 이름이 아니라 인덱스로 저장돼 있어 names 로 되짚는다.
function series(dong, now) {
  const i = hist?.names?.indexOf(dong) ?? -1;
  const pts = i < 0 ? [] : hist.snaps.map((s) => ({ t: Date.parse(s.t), v: s.u[i] })).filter((p) => p.v != null);
  return withNow(pts, now);
}
const totalSeries = (now) => withNow((hist?.snaps ?? []).map((s) => ({ t: Date.parse(s.t), v: s.a })), now);

// 한 시간 전 값과의 차이. 기록이 1시간치보다 짧으면 가진 만큼으로 환산한다.
function perHour(pts) {
  if (pts.length < 2) return null;
  const now = pts.at(-1);
  const target = now.t - 3.6e6;
  // 1시간 이전 것 중 가장 최근 점. 앞에서부터 찾으면 기록이 모두 1시간보다 오래됐을 때
  // 방금 붙인 현재 점을 스스로 기준으로 잡아 구간이 0 이 된다.
  const base = [...pts].reverse().find((p) => p.t <= target) ?? pts[0];
  const hours = (now.t - base.t) / 3.6e6;
  // 짧은 구간을 시간당으로 곱하면 크게 부풀려진다. 10분에 1건이 "+6" 으로 보이던 문제.
  if (hours < 0.34) return null;
  return Math.round((now.v - base.v) / hours);
}

function spark(pts, color) {
  if (pts.length < 2) return '<span class="speed">–</span>';
  const w = 70, h = 20;
  const xs = pts.map((p) => p.t), ys = pts.map((p) => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y1 = Math.max(...ys), y0 = 0; // 0 을 바닥으로 고정해야 증가폭이 과장되지 않는다
  const px = (t) => (x1 === x0 ? w : ((t - x0) / (x1 - x0)) * w);
  const py = (v) => h - (y1 === y0 ? 0 : ((v - y0) / (y1 - y0)) * h);
  const d = pts.map((p) => `${px(p.t).toFixed(1)},${py(p.v).toFixed(1)}`).join(' ');
  const last = pts.at(-1);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${px(last.t).toFixed(1)}" cy="${py(last.v).toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

function render(d) {
  $('title').textContent = d.name;
  if (d.schedule) {
    closesAt = new Date(d.schedule.closesAt).getTime();
    $('period').textContent = `접수 ${d.schedule.from} ~ ${d.schedule.to}`;
    countdown();
  }

  const total = d.total;
  const tr = rate(total.applied, total.quota);
  const nowT = Date.parse(d.at);
  const tSpeed = perHour(totalSeries({ t: nowT, v: total.applied }));

  curSi = {};
  for (const u of d.units) {
    (curSi[u.si] ??= { q: 0, a: 0 });
    curSi[u.si].q += u.quota;
    curSi[u.si].a += u.applied;
  }

  const sorted = [...d.units].sort((a, b) => rate(b.applied, b.quota) - rate(a.applied, a.quota));
  const rows = sorted;

  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  $('app').innerHTML = `
    <div class="summary">
      <div class="stat"><b>${tr.toFixed(2)}:1</b><span>전체 경쟁률</span></div>
      <div class="stat"><b>${fmt(total.applied)}</b><span>신청건수</span>
        ${tSpeed != null ? `<span class="delta">시간당 +${tSpeed}건</span>` : ''}</div>
      <div class="stat"><b>${fmt(total.quota)}</b><span>모집인원</span></div>
      <div class="stat"><b>${rows.filter((u) => rate(u.applied, u.quota) >= 1).length}/${rows.length}</b><span>1:1 넘은 단지</span></div>
    </div>

    <div class="scroll"><table class="ranks">
      <thead><tr>
        <th>순위</th><th>단지</th><th>매물</th><th>모집</th><th>신청</th><th>시간당</th><th>경쟁률</th><th>과거</th>
        <th class="sparkcell">추이</th><th class="barcell"></th>
      </tr></thead>
      <tbody>${rows.map((u, i) => {
        const r = rate(u.applied, u.quota);
        const pts = series(u.dong, { t: nowT, v: u.applied });
        const sp = perHour(pts);
        const color = r >= 2 ? css('--over') : r >= 1 ? css('--hot') : css('--cool');
        return `<tr>
          <td class="rank">${i + 1}</td>
          <td><span class="name">${u.dong ?? ''}</span><span class="sido">${(u.sido ?? '').replace('경기도', '')}</span></td>
          <td>${houses?.[u.dong]?.length ? `<button class="unitbtn" onclick="openHouses('${u.dong}')">${houses[u.dong].length}호</button>` : '<span class="speed">–</span>'}</td>
          <td>${fmt(u.quota)}</td>
          <td>${fmt(u.applied)}</td>
          <td class="speed ${sp > 0 ? 'up' : ''}">${sp == null ? '–' : sp > 0 ? `+${sp}` : sp}</td>
          <td class="rate ${cls(r)}">${r.toFixed(2)}</td>
          <td>${pastRates(u.si).length
            ? `<button class="unitbtn" onclick="openPast('${u.si}')">${median(pastRates(u.si)).toFixed(1)}</button>`
            : '<span class="speed">–</span>'}</td>
          <td class="sparkcell">${spark(pts, color)}</td>
          <td class="barcell"><div class="bar ${cls(r)}"><i style="width:${Math.min(100, r * 50)}%"></i></div></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <p class="note">
      ${hist?.snaps?.length ? `추이는 5분마다 기록된 스냅샷 ${hist.snaps.length}개 기준입니다.`
        : '추이 기록이 아직 없습니다 — 첫 스냅샷이 쌓이면 표시됩니다.'}
      ${past ? `<button class="unitbtn" onclick="openPastAll()">전년도 경쟁률 이력 ${past.rounds.length}회차 →</button>` : ''}
    </p>`;

  $('updated').textContent = `갱신 ${new Date(d.at).toLocaleTimeString('ko-KR')} · 60초마다 자동 갱신`;
}

async function load() {
  try {
    // 추이는 리포에 쌓인 스냅샷을 직접 읽는다. 5분마다 재배포하지 않으려는 것.
    const [live, h, hs, pa] = await Promise.all([
      fetch('/api/rate', { cache: 'no-store' }).then(async (r) => {
        const j = await r.json();
        if (!r.ok) throw new Error(j.error ?? `HTTP ${r.status}`);
        return j;
      }),
      fetch(HISTORY, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      // 공고가 바뀌지 않는 한 고정이라 한 번만 받는다.
      houses ?? fetch('/houses.json').then((r) => (r.ok ? r.json() : null)).catch(() => null),
      past ?? fetch('/past.json').then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    hist = h;
    houses = hs ?? houses;
    past = pa ?? past;
    render(live);
  } catch (e) {
    $('app').innerHTML = `<div class="err">불러오지 못했습니다 — ${e.message}</div>`;
    $('status').textContent = '오류';
    $('dot').className = 'dot closed';
  }
}

load();
setInterval(load, 60_000);
setInterval(countdown, 1000);
</script>
</body>
</html>
