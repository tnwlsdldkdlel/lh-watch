<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LH 실시간 경쟁률</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: light; /* 시스템이 다크여도 라이트로 고정 */
    --bg: #f6f8fa; --panel: #fff; --line: #d8dee4;
    --fg: #1f2328; --mute: #636c76;
    --hot: #bf8700; --over: #d1242f; --cool: #0969da; --ok: #1a7f37;
    --pin: #8250df;
    --mono: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums; /* 숫자 자리폭 고정 — 표가 흔들리지 않게 */
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }

  header { margin-bottom: 20px; }
  h1 { font-size: 17px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--mute); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.closed { background: var(--mute); }

  .summary {
    display: flex; gap: 12px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px;
  }
  .stat { flex: 1; min-width: 104px; }
  .stat b { display: block; font: 650 26px/1.15 var(--mono); letter-spacing: -.02em; }
  .stat span { color: var(--mute); font-size: 12px; display: block; }
  .stat .delta { color: var(--ok); font-family: var(--mono); }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; min-width: 620px; }
  th {
    text-align: right; font-size: 11px; font-weight: 600; color: var(--mute);
    padding: 0 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  th:first-child { text-align: left; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--mono); font-size: 14px; white-space: nowrap; }
  td:first-child { text-align: left; font-family: inherit; }
  tr:last-child td { border-bottom: 0; }
  .name { font-weight: 550; }
  .sido { color: var(--mute); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .delta { color: var(--ok); font-size: 12px; }
  .speed { color: var(--mute); font-size: 13px; }
  .speed.up { color: var(--fg); }
  .rate { font-weight: 650; }
  .rate.over { color: var(--over); }
  .rate.hot { color: var(--hot); }
  .rate.cool { color: var(--mute); }

  /* 노리는 단지는 정렬과 무관하게 맨 위에 붙여둔다. */
  tr.pin td { background: #faf7ff; }
  tr.pin td:first-child { box-shadow: inset 3px 0 0 var(--pin); }
  .tag { font-size: 10px; font-weight: 700; color: var(--pin); border: 1px solid var(--pin); border-radius: 4px; padding: 1px 4px; margin-left: 6px; vertical-align: 1px; }

  /* 1.0:1 을 눈금 삼아 미달/초과를 한눈에 가른다. */
  .bar { width: 100%; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--cool); border-radius: 3px; }
  .bar.over i { background: var(--over); }
  .bar.hot i { background: var(--hot); }
  .barcell { width: 90px; padding-left: 12px; }
  .sparkcell { width: 78px; }
  svg.spark { display: block; overflow: visible; }

  footer { margin-top: 22px; color: var(--mute); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  a { color: var(--cool); }
  .err { background: #fff1f0; border: 1px solid #ffb4ae; color: var(--over); padding: 12px 14px; border-radius: 10px; font-size: 13px; }
  .skel { color: var(--mute); padding: 30px 0; text-align: center; }
  .note { color: var(--mute); font-size: 12px; margin-top: 10px; }

  .unitbtn {
    font: inherit; font-size: 13px; font-family: var(--mono); color: var(--cool);
    background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 8px; cursor: pointer;
  }
  .unitbtn:hover { border-color: var(--cool); background: #f2f7fd; }

  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0;
    max-width: min(760px, 92vw); width: 760px; max-height: 84vh;
    background: var(--panel); color: var(--fg);
  }
  dialog::backdrop { background: rgba(20, 24, 30, .45); }
  .dlg-head { display: flex; align-items: baseline; gap: 10px; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { font-size: 16px; margin: 0; font-weight: 650; }
  .dlg-head .meta { color: var(--mute); font-size: 12px; }
  .dlg-head button { margin-left: auto; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--mute); cursor: pointer; }
  .dlg-body { overflow: auto; max-height: calc(84vh - 64px); padding: 0 22px 20px; }
  .dlg-body table { margin-top: 0; min-width: 640px; }
  .dlg-body th { position: sticky; top: 0; background: var(--panel); z-index: 1; padding-top: 12px; }
  .addr { color: var(--mute); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">LH 실시간 경쟁률</h1>
    <div class="sub">
      <span><span class="dot" id="dot"></span> <span id="status">불러오는 중…</span></span>
      <span id="period"></span>
    </div>
  </header>

  <div id="app"><div class="skel">불러오는 중…</div></div>

  <footer>
    <span id="updated"></span>
    <span><a href="https://apply.lh.or.kr/lhapply/apply/wt/wrtanc/selectWrtancList.do?mi=1026" target="_blank" rel="noopener">LH청약플러스 원문</a></span>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <span class="meta" id="dlg-meta"></span>
    <button type="button" aria-label="닫기" onclick="document.getElementById('dlg').close()">×</button>
  </div>
  <div class="dlg-body"><div class="scroll" id="dlg-body"></div></div>
</dialog>

<script type="module">
const PINNED = '경기군포';
const HISTORY = '/api/history';

const $ = (id) => document.getElementById(id);
const rate = (a, q) => (q ? a / q : 0);
const fmt = (n) => n.toLocaleString('ko-KR');
const cls = (r) => (r >= 2 ? 'over' : r >= 1 ? 'hot' : 'cool');

let closesAt = null;
let hist = null;
let houses = null;

const man = (n) => `${Math.round(n / 10000).toLocaleString('ko-KR')}만`;

// 공고 첨부 주택목록에서 구운 정적 파일. 매물 단위 경쟁률은 LH 가 공개하지 않아 물건 정보만 보여준다.
function openHouses(dong) {
  const list = houses?.[dong];
  if (!list?.length) return;
  $('dlg-title').textContent = dong;
  $('dlg-meta').textContent = `공급 ${list.length}호 · 임대조건은 소득 80% 이하 기준`;
  $('dlg-body').innerHTML = `<table>
    <thead><tr><th>순번</th><th>주소</th><th>호</th><th>전용</th><th>방</th><th>층</th><th>보증금</th><th>월세</th></tr></thead>
    <tbody>${list.map((h) => `<tr>
      <td>${h.no}</td>
      <td><span class="addr">${h.addr}</span></td>
      <td>${h.ho}</td>
      <td>${h.area}㎡</td>
      <td>${h.rooms}</td>
      <td>${h.floor}</td>
      <td>${man(h.deposit)}</td>
      <td>${h.rent.toLocaleString('ko-KR')}</td>
    </tr>`).join('')}</tbody>
  </table>`;
  $('dlg').showModal();
}
window.openHouses = openHouses;

function countdown() {
  if (!closesAt) return;
  const ms = closesAt - Date.now();
  if (ms <= 0) { $('status').textContent = '접수 마감'; $('dot').className = 'dot closed'; return; }
  const h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1000) % 60;
  $('status').textContent = `마감까지 ${h}시간 ${String(m).padStart(2, '0')}분 ${String(s).padStart(2, '0')}초`;
}

// 값이 안 변하면 스냅샷을 남기지 않으므로 기록만으로는 최근 구간이 비어 보인다.
// 지금 값을 항상 끝점으로 붙여야 "시간당"이 옛 구간으로 계산되지 않는다.
const withNow = (pts, now) => (pts.at(-1)?.t === now.t ? pts : [...pts, now]);

// 단지별 시계열. 이름이 아니라 인덱스로 저장돼 있어 names 로 되짚는다.
function series(dong, now) {
  const i = hist?.names?.indexOf(dong) ?? -1;
  const past = i < 0 ? [] : hist.snaps.map((s) => ({ t: Date.parse(s.t), v: s.u[i] })).filter((p) => p.v != null);
  return withNow(past, now);
}
const totalSeries = (now) => withNow((hist?.snaps ?? []).map((s) => ({ t: Date.parse(s.t), v: s.a })), now);

// 한 시간 전 값과의 차이. 기록이 1시간치보다 짧으면 가진 만큼으로 환산한다.
function perHour(pts) {
  if (pts.length < 2) return null;
  const now = pts.at(-1);
  const target = now.t - 3.6e6;
  const base = pts.find((p) => p.t >= target) ?? pts[0];
  const hours = (now.t - base.t) / 3.6e6;
  // 짧은 구간을 시간당으로 곱하면 크게 부풀려진다. 10분에 1건이 "+6" 으로 보이던 문제.
  if (hours < 0.34) return null;
  return Math.round((now.v - base.v) / hours);
}

function spark(pts, color) {
  if (pts.length < 2) return '<span class="speed">–</span>';
  const w = 70, h = 20;
  const xs = pts.map((p) => p.t), ys = pts.map((p) => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y1 = Math.max(...ys), y0 = 0; // 0 을 바닥으로 고정해야 증가폭이 과장되지 않는다
  const px = (t) => (x1 === x0 ? w : ((t - x0) / (x1 - x0)) * w);
  const py = (v) => h - (y1 === y0 ? 0 : ((v - y0) / (y1 - y0)) * h);
  const d = pts.map((p) => `${px(p.t).toFixed(1)},${py(p.v).toFixed(1)}`).join(' ');
  const last = pts.at(-1);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${px(last.t).toFixed(1)}" cy="${py(last.v).toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

function render(d) {
  $('title').textContent = d.name;
  if (d.schedule) {
    closesAt = new Date(d.schedule.closesAt).getTime();
    $('period').textContent = `접수 ${d.schedule.from} ~ ${d.schedule.to}`;
    countdown();
  }

  const total = d.total;
  const tr = rate(total.applied, total.quota);
  const nowT = Date.parse(d.at);
  const tSpeed = perHour(totalSeries({ t: nowT, v: total.applied }));

  const sorted = [...d.units].sort((a, b) => rate(b.applied, b.quota) - rate(a.applied, a.quota));
  const rows = [...sorted.filter((u) => u.dong === PINNED), ...sorted.filter((u) => u.dong !== PINNED)];
  const pinRank = sorted.findIndex((u) => u.dong === PINNED) + 1;
  const pin = sorted.find((u) => u.dong === PINNED);

  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  $('app').innerHTML = `
    <div class="summary">
      <div class="stat"><b>${tr.toFixed(2)}:1</b><span>전체 경쟁률</span></div>
      <div class="stat"><b>${fmt(total.applied)}</b><span>신청건수</span>
        ${tSpeed != null ? `<span class="delta">시간당 +${tSpeed}건</span>` : ''}</div>
      <div class="stat"><b>${fmt(total.quota)}</b><span>모집인원</span></div>
      ${pin ? `<div class="stat"><b style="color:var(--pin)">${rate(pin.applied, pin.quota).toFixed(2)}:1</b>
        <span>${PINNED} · 경쟁률 ${pinRank}위/${sorted.length}</span></div>` : ''}
    </div>

    <div class="scroll"><table>
      <thead><tr>
        <th>단지</th><th>매물</th><th>모집</th><th>신청</th><th>시간당</th><th>경쟁률</th>
        <th class="sparkcell">추이</th><th class="barcell"></th>
      </tr></thead>
      <tbody>${rows.map((u) => {
        const r = rate(u.applied, u.quota);
        const pts = series(u.dong, { t: nowT, v: u.applied });
        const sp = perHour(pts);
        const isPin = u.dong === PINNED;
        const color = isPin ? css('--pin') : r >= 2 ? css('--over') : r >= 1 ? css('--hot') : css('--cool');
        return `<tr class="${isPin ? 'pin' : ''}">
          <td><span class="name">${u.dong ?? ''}</span>${isPin ? '<span class="tag">목표</span>' : `<span class="sido">${(u.sido ?? '').replace('경기도', '')}</span>`}</td>
          <td>${houses?.[u.dong]?.length ? `<button class="unitbtn" onclick="openHouses('${u.dong}')">${houses[u.dong].length}호</button>` : '<span class="speed">–</span>'}</td>
          <td>${fmt(u.quota)}</td>
          <td>${fmt(u.applied)}</td>
          <td class="speed ${sp ? 'up' : ''}">${sp == null ? '–' : sp > 0 ? `+${sp}` : sp}</td>
          <td class="rate ${cls(r)}">${r.toFixed(2)}</td>
          <td class="sparkcell">${spark(pts, color)}</td>
          <td class="barcell"><div class="bar ${cls(r)}"><i style="width:${Math.min(100, r * 50)}%"></i></div></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    ${hist?.snaps?.length ? `<p class="note">추이는 5분마다 기록된 스냅샷 ${hist.snaps.length}개 기준입니다.</p>`
      : `<p class="note">추이 기록이 아직 없습니다 — 첫 스냅샷이 쌓이면 표시됩니다.</p>`}`;

  $('updated').textContent = `갱신 ${new Date(d.at).toLocaleTimeString('ko-KR')} · 60초마다 자동 갱신`;
}

async function load() {
  try {
    // 추이는 리포에 쌓인 스냅샷을 직접 읽는다. 5분마다 재배포하지 않으려는 것.
    const [live, h, hs] = await Promise.all([
      fetch('/api/rate', { cache: 'no-store' }).then(async (r) => {
        const j = await r.json();
        if (!r.ok) throw new Error(j.error ?? `HTTP ${r.status}`);
        return j;
      }),
      fetch(HISTORY, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      // 공고가 바뀌지 않는 한 고정이라 한 번만 받는다.
      houses ?? fetch('/houses.json').then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    hist = h;
    houses = hs ?? houses;
    render(live);
  } catch (e) {
    $('app').innerHTML = `<div class="err">불러오지 못했습니다 — ${e.message}</div>`;
    $('status').textContent = '오류';
    $('dot').className = 'dot closed';
  }
}

load();
setInterval(load, 60_000);
setInterval(countdown, 1000);
</script>
</body>
</html>
