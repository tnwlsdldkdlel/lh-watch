name: 경쟁률 스냅샷

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub 최소 간격이 5분이고, 부하에 따라 더 늦게 돌 수 있다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node snapshot.mjs

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && echo "변화 없음" && exit 0
          git commit -m "chore: 경쟁률 스냅샷 $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
